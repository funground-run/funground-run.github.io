<!doctype html>
<!-- The funground preview page (D-078). The editor at funground-hq.github.io/play/ shows this page in a sandboxed
     iframe and sends it sketches by postMessage; preview.js runs them and reports back. Nothing here is stored. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>funground preview</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <canvas id="canvas" width="640" height="400" aria-label="The sketch"></canvas>
  <!-- The guides (S-202): a grid and the mouse's position, over the canvas. preview.js fills it; it takes no mouse. -->
  <div id="guides" aria-hidden="true" hidden></div>
  <script type="module" src="preview.js"></script>
</body>
</html>
